name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: no workflow-wide token grant. Each job declares the
# narrowest permissions it needs; a compromised dependency in one job
# cannot read or write what that job does not use.

# A newer push supersedes an in-flight run on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    # Checkout reads the repository; nothing else touches the token.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # 3.8 pinned to ubuntu-22.04: actions/python-versions does not ship a
        # 3.8 build for ubuntu-24.04. The oldest entry exists to prove the
        # "python 3.8+" badge rather than assert it.
        include:
          - { os: ubuntu-22.04, python: "3.8" }
          - { os: ubuntu-latest, python: "3.9" }
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: windows-latest, python: "3.13" }
          - { os: macos-latest, python: "3.13" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      # Catches syntax unsupported on older interpreters before any test runs.
      - name: Byte-compile all modules
        run: python -m compileall -q scripts

      # --offline skips the three checks needing a live Ollama server plus
      # --live itself; the remaining 61 cover error taxonomy, parsing, input
      # validation, consensus ordering, context sizing, a fake-Ollama E2E
      # path, and an MCP stdio E2E path, none of which need inference or
      # network access.
      - name: Self-test
        run: python scripts/selftest.py --offline

  # The stdio E2E spawns the real mcp_server.py process and drives it with
  # scripted JSON-RPC frames - initialize, a notification, tools/list, and
  # tools/call (one review through the fake Ollama, one rejection) - the
  # layer the in-process dispatch checks bypass. Kept as a named job so a
  # framing/lifecycle regression shows up as its own red signal.
  mcp-stdio:
    name: mcp stdio end to end
    runs-on: ubuntu-latest
    # Pure compute: spawns the server, drives JSON-RPC, runs no git commands
    # against GitHub. none means the job's token is inert. (If this repo ever
    # goes private, checkout needs contents: read here too.)
    permissions:
      contents: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Byte-compile all modules
        run: python -m compileall -q scripts

      - name: MCP checks incl. spawned-server stdio end-to-end
        run: python scripts/selftest.py --offline --check mcp

  installers:
    name: installer syntax
    runs-on: ubuntu-latest
    # Syntax checks only - bash -n, a PowerShell parse, a grep. The token is
    # inert (same private-repo caveat as mcp-stdio if checkout ever needs
    # contents: read).
    permissions:
      contents: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: bash syntax check
        run: bash -n install.sh

      - name: executable bit preserved
        run: test -x install.sh || (echo "install.sh is not executable" && exit 1)

      - name: PowerShell parse check
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) {
            $errors | ForEach-Object { Write-Host $_.Message }
            exit 1
          }
          Write-Host "install.ps1 parses cleanly"

      - name: LF line endings on shell script
        run: |
          if grep -qU $'\r' install.sh; then
            echo "install.sh contains CRLF, which breaks the POSIX shebang"
            exit 1
          fi
          echo "install.sh is LF-clean"
