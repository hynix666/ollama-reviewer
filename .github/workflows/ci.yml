name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: no workflow-wide token grant. Each job declares the
# narrowest permissions it needs; a compromised dependency in one job
# cannot read or write what that job does not use.

# Concurrency is namespaced three ways: by workflow (so another workflow's
# runs can never share this group), by event type (a push to a branch and a
# pull_request run for that branch are distinct streams - neither cancels
# the other mid-run), and by ref (so only a newer run of the same event on
# the same ref supersedes an older one). Within a namespace, newest wins.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# No dependency cache: the suite is pure standard library - no pip install,
# no requirements file (README: "no pip install, no dependencies") - so there
# is nothing to cache and an actions/cache step would only add a round-trip
# and a third-party action to the supply chain. If a dependency is ever
# added, cache it here keyed on the requirements hash, and extend the
# pinning policy: the cache action is third-party code like any other and
# gets pinned to a release SHA.

jobs:
  test:
    name: ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    # Checkout reads the repository; nothing else touches the token.
    permissions:
      contents: read
    strategy:
      # Runner images are pinned, never -latest: a floating label retargets
      # every workflow at once, mid-flight, with no PR to review - the
      # ubuntu-latest move to Ubuntu 26 lands 2026-10-19 that way. This repo
      # has already paid for it once: Python 3.8 builds stopped existing when
      # ubuntu-latest reached 24.04, which is why the 3.8 leg sits on 22.04.
      # Pinning costs no patches - GitHub keeps a supported image updated in
      # place - it costs owed maintenance, and that is what the vocabulary in
      # selftest's "ci: runner images pinned to known labels" is for: a typo, a
      # retired label or a new -latest fails the suite instead of reaching CI.
      # Upgrade a pin when the migration is reviewed, not when the label moves
      # under us (ubuntu-26.04 is already offered; ubuntu-latest still
      # resolves to ubuntu-24.04, so that is today's pin).
      #
      # windows-latest currently resolves to the windows-2025-vs2026 image;
      # the pin is windows-2025, the OS-level label, because this suite has no
      # Visual Studio dependency and the OS label outlives preview variants.
      # macos-latest resolves to macos-26-arm64, which the macos-26 label asks
      # for. The pins were read off the 2026-09-26 run's own job logs (each
      # job's "Runner Image" group names the image it got) and GitHub's
      # GitHub-hosted runners reference, so they freeze what is proven today
      # rather than guessing.
      fail-fast: false
      matrix:
        # 3.8 pinned to ubuntu-22.04: actions/python-versions does not ship a
        # 3.8 build for ubuntu-24.04. The oldest entry exists only to prove
        # the "python 3.8+" badge: compileall runs everywhere, but the full
        # suite is skipped on 3.8 - three other interpreters already run it.
        include:
          - { os: ubuntu-22.04, python: "3.8" }
          - { os: ubuntu-24.04, python: "3.9" }
          - { os: ubuntu-24.04, python: "3.11" }
          - { os: ubuntu-24.04, python: "3.13" }
          - { os: windows-2025, python: "3.13" }
          - { os: macos-26, python: "3.13" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      # Catches syntax unsupported on older interpreters before any test runs.
      - name: Byte-compile all modules
        run: python -m compileall -q scripts

      # --offline skips the three checks needing a live Ollama server plus
      # --live itself; the remaining 61 cover error taxonomy, parsing, input
      # validation, consensus ordering, context sizing, a fake-Ollama E2E
      # path, and an MCP stdio E2E path, none of which need inference or
      # network access.
      - name: Self-test
        if: matrix.python != '3.8'
        run: python scripts/selftest.py --offline

  # Meta-verification, not another test run: --mutate applies each of the 25
  # registry mutations in turn, requires the checks named for it to fail, then
  # restores the source byte-exact. A green run proves the suite still catches
  # the regressions it claims to, so guard decay - a check weakened, an anchor
  # rotted, a new source left unprotected - fails the PR instead of waiting for
  # a local --mutate run that may never happen. The baseline suite runs first,
  # so a red job means lost coverage, not a pre-existing break. All mutations
  # run offline, so this needs no server, no network, and no token grant.
  #
  # One entry - the journal-heal cross-drive fallback - is declared
  # windows-only: drive-relative paths exist nowhere else, so the ubuntu leg
  # reports it as scoped away rather than counting it as caught, and the
  # windows leg is what requires it to be caught. That is the point of the
  # second operating system: a guard can be weaker on one platform, and a
  # mutation still caught on Linux but silently missed on Windows fails CI
  # here instead of shipping a guard that is weaker than its entry claims.
  mutation-guards:
    name: mutation guards have teeth · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Pure compute: mutates and restores working-tree files only, runs no git
    # commands against GitHub. none means the job's token is inert. (If this
    # repo ever goes private, checkout needs contents: read here too.)
    permissions:
      contents: none
    strategy:
      # Same interpreter on both legs: the OS is the only variable, so one red
      # leg names the platform rather than a version interaction. Neither leg
      # cancels the other - a platform-specific miss must stay visible even
      # when the other platform is also red.
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Byte-compile all modules
        run: python -m compileall -q scripts

      - name: Apply every registered mutation; require each guard to fire
        run: python scripts/selftest.py --mutate

  # The stdio E2E spawns the real mcp_server.py process and drives it with
  # scripted JSON-RPC frames - initialize, a notification, tools/list, and
  # tools/call (one review through the fake Ollama, one rejection) - the
  # layer the in-process dispatch checks bypass. Kept as a named job so a
  # framing/lifecycle regression shows up as its own red signal.
  mcp-stdio:
    name: mcp stdio end to end
    runs-on: ubuntu-24.04
    # Pure compute: spawns the server, drives JSON-RPC, runs no git commands
    # against GitHub. none means the job's token is inert. (If this repo ever
    # goes private, checkout needs contents: read here too.)
    permissions:
      contents: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Byte-compile all modules
        run: python -m compileall -q scripts

      - name: MCP checks incl. spawned-server stdio end-to-end
        run: python scripts/selftest.py --offline --check mcp

  installers:
    name: installer syntax
    runs-on: ubuntu-24.04
    # Syntax checks only - bash -n, a PowerShell parse, a grep. The token is
    # inert (same private-repo caveat as mcp-stdio if checkout ever needs
    # contents: read).
    permissions:
      contents: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: bash syntax check
        run: bash -n install.sh

      - name: executable bit preserved
        run: test -x install.sh || (echo "install.sh is not executable" && exit 1)

      - name: PowerShell parse check
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) {
            $errors | ForEach-Object { Write-Host $_.Message }
            exit 1
          }
          Write-Host "install.ps1 parses cleanly"

      - name: LF line endings on shell script
        run: |
          if grep -qU $'\r' install.sh; then
            echo "install.sh contains CRLF, which breaks the POSIX shebang"
            exit 1
          fi
          echo "install.sh is LF-clean"
